<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario PRO | CSS</title>
    <link rel="shortcut icon" href="../img/lightxmisa.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <header>
        <div class="fix">
            <h1>Fondo Translucido</h1>
            <img src="../img/misaXL.jpg" alt="Imagen de fondo">
        </div>
    </header>
    <video autoplay loop muted>
        <source src="../videos/videoL.mp4" type="video/mp4">
    </video>
    <main>
        <form action="" method="post" class="formu">
            <fieldset class="formu">
                <legend>Inscripción</legend>
                <label for="name">Nombre</label> <br>
                <input type="text" name="name" id="name" required> <br>

                <label for="email">Email</label> <br>
                <input type="email" name="email" id="email" required> <br>

                <label for="password">Contraseña</label> <br>
                <input type="password" name="password" id="password" required> <br> <br>
                <input type="submit" value="Enviar" id="btn">
            </fieldset>
        </form>
    </main>
</body>
</html>
