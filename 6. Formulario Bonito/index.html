<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="menu">
        <a href="index.html">Inicio</a><a href="Contactos">Contactos</a><a href="Acerca">Acerca</a>
    </nav>
    <div class="container1">
        <form action="" method="post">
        <h1>Formularios HTML</h1>
        <hr>
        <label for="name">Nombre</label> <br>
        <input name="name" id="name" type="text" placeholder="Ingrese su nombre" required> <br> <br>

        <label for="last_name">Apellido</label> <br>
        <input name="last_name" id="last_name" type="text" placeholder="Ingrese su Apellido" required> <br> <br>

        <label for="age">Edad</label> <br>
        <input type="number" name="age" id="age" placeholder="Ingrese su edad" required> <br> <br>
        
        <label for="password">Contraseña</label> <br>
        <input name="password" id="password" type="password" placeholder="Ingrese su Contraseña" required> <br> <br>
        
        <label for="email">Email</label> <br>
        <input name="email" id="email" type="email" placeholder="Ingrese su email" required> <br> <br>
<div class="genero">
        <label for="Genero">Genero</label> <br>
        <input type="radio" name="Genero" id="masculino" value="masculino" required>
        <label for="masculino">Masculino</label>
        <input type="radio" name="Genero" id="femenino" value="femenino" required> <br> <br>
        <label for="femenino">Femenino</label>
    </div>
        <input id="submit" type="submit" value="Enviar">
    </form>
</div>
</body>
</html>
